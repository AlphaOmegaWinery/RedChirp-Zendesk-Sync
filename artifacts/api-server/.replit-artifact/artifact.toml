kind = "api"
previewPath = "/"
title = "RedChirp Zendesk Sync"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/"]

[services.development]
run = "pnpm --filter redchirp-zendesk-sync run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "redchirp-zendesk-sync", "run", "build"]

[services.production.run]
args = ["node", "artifacts/redchirp-zendesk-sync/dist/src/index.js"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/health"
